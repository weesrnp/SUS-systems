services:
  sus-systems:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sus-systems-app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - APP_DEBUG=false
    volumes:
      # Desenvolvimento: código montado ao vivo (comente em produção)
      - ./:/var/www/html
