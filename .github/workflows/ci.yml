name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: PHP ${{ matrix.php }} Test & Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ftp, zip, curl, mbstring
          coverage: none

      - name: Validar sintaxe (php -l) em todos os arquivos PHP
        run: |
          find . -name "*.php" -not -path "./legacy-python/*" -print0 | xargs -0 -n1 php -l

      - name: Executar suíte de testes
        run: |
          php tests/run.php

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: |
          docker build -f docker/Dockerfile -t sus-systems:ci .
